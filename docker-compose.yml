services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    command: --local
    volumes:
      - tg-files:/var/lib/telegram-bot-api

  bot:
    image: ghcr.io/myraxion/immich-telegram-bot:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      - telegram-bot-api
    volumes:
      - tg-files:/var/lib/telegram-bot-api:ro
      - ./data:/data

volumes:
  tg-files:
